<canvas id="cielo" aria-hidden="true"></canvas>

<!-- avanzamento (telefoni) -->
<div class="progress" id="progress" aria-hidden="true"><i></i></div>

<!-- torre laterale che cresce con lo scroll (schermi larghi) -->

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Topplers"><span>T</span><span>O</span><span>P</span><span>P</span><span>L</span><span>E</span><span>R</span><span>S</span></a>
    <nav class="links" aria-label="Sections">
      <a href="#custom" data-t="nav_lab"></a>
      <a href="#worlds" data-t="nav_worlds"></a>
      <a href="#rewards" data-t="nav_rewards"></a>
      <a href="#goals" data-t="nav_goals"></a>

<main id="top">

  <!-- ===== HERO ===== -->

    <div class="wrap hero-grid">

        <p class="lead" data-t="hero_lead"></p>
        <div class="ctas">
          <a class="btn" href="#custom" data-t="cta_play"></a>
          <a class="btn blue" id="ksbtn" href="#" target="_blank" rel="noopener" data-t="cta_ks"></a>

        </div>
        <p class="toy-hint" data-t="toy_hint"></p>
      </div>
      <div class="hero-art" id="heroart">
        <div class="phone" data-tilt><img src="assets/keyart_sm.webp" width="520" height="920" alt="Topplers key art"></div>
      </div>

    <a class="scroll-cue" href="#why" aria-label="Scroll"><span data-t="scroll_cue"></span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </section>

  <div class="ribbon-box r1" aria-hidden="true"><div class="ribbon" data-dir="-1"><div class="rb-track"></div></div></div>

  <!-- ===== PERCHE' ===== -->

      </div>
      <div class="hs-ui" id="hsUi"><div class="hs-rail"><i id="hsFill"></i></div><div class="hs-stops" id="hsStops"></div></div>
    </div>
  </section>

  <!-- ===== POTENZIAMENTI ===== -->
  <section id="powerups" data-world="orbit" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="pu_h"></h2><p class="lede" data-t="pu_p"></p></div>
      <div class="pus" id="pulist"></div>
    </div>
  </section>

  <!-- ===== PERSONALIZZAZIONE: ANTEPRIMA ===== -->
  <section id="custom" data-world="dawn" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="cu_h"></h2><p class="lede" data-t="cu_p"></p></div>
      <div class="lab" data-rv="pop">
        <div class="lab-stage" id="labStage" role="img" data-t-aria="lab_stage">
          <div class="lab-sun" aria-hidden="true"></div>
          <div class="lab-cloud c-a" aria-hidden="true"></div><div class="lab-cloud c-b" aria-hidden="true"></div>
          <div class="lab-far" aria-hidden="true"></div>
          <img class="lab-base" id="labBase" alt="" width="300" height="784">
          <div class="lab-stack" id="labStack"></div>
          <div class="lab-ground" aria-hidden="true"></div>
          <button class="lab-pet" id="labPet" type="button" aria-label="Pet"></button>
          <p class="lab-name" id="labName" aria-live="polite"></p>
        </div>
        <div class="lab-ctrl" id="labCtrl" data-tab="skins">
          <div class="lab-tabs" id="labTabs" role="tablist">
            <button type="button" role="tab" data-tab="skins" aria-selected="true" data-t="lab_pieces"></button>
            <button type="button" role="tab" data-tab="bases" aria-selected="false" data-t="lab_base"></button>
            <button type="button" role="tab" data-tab="pets" aria-selected="false" data-t="lab_pet"></button>
          </div>
          <div class="lab-tiles" id="labSkins" role="group" data-t-aria="lab_pieces"></div>
          <div class="lab-tiles" id="labBases" role="group" data-t-aria="lab_base"></div>
          <div class="lab-tiles" id="labPets" role="group" data-t-aria="lab_pet"></div>
          <p class="lab-hint" data-t="lab_hint"></p>
        </div>
      </div>
      <div class="card titles" data-rv="pop">
        <h3 data-t="cu3_h"></h3><p data-t="cu3_p"></p>
        <div class="targhe" id="targhe"></div>
      </div>
    </div>
  </section>

  <!-- ===== COSTRUZIONE LIBERA ===== -->
  <section id="free" data-world="plains" data-tp>
    <div class="wrap free">
      <div class="free-text">
        <h2 class="pl" data-t="free_h"></h2>
        <p class="lede" data-t="free_p"></p>
        <div class="altimetro" id="alt" data-rv="pop">
          <div class="alt-top"><span data-t="fb_rec"></span><output id="altOut" for="altRange"><b>0</b> m</output></div>
          <input type="range" id="altRange" min="0" max="65" step="1" value="0" data-t-aria="fb_drag">
          <p class="alt-note" data-t="fb_drag"></p>
          <ul class="miles" id="miles"></ul>
        </div>
      </div>
      <div class="free-phone" id="freePhone"></div>
    </div>
  </section>

  <!-- ===== STATO ===== -->
  <section id="status" data-world="ice" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="status_h"></h2><p class="lede" data-t="status_p"></p></div>
      <div class="status" id="statuslist"></div>
    </div>
  </section>

  <!-- ===== RICOMPENSE ===== -->
  <section id="rewards" data-world="lava" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="rew_h"></h2><p class="lede" data-t="rew_p"></p></div>
      <div class="tiers" id="tiers"></div>
    </div>
  </section>

  <div class="ribbon-box r2" aria-hidden="true"><div class="ribbon" data-dir="1"><div class="rb-track"></div></div></div>

  <!-- ===== STRETCH GOAL ===== -->
  <section id="goals" data-world="orbit" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="goals_h"></h2><p class="lede" data-t="goals_p"></p></div>
      <div class="simcard" data-rv="pop">
        <div class="row"><label for="sim" data-t="sim_label"></label><output id="simout" for="sim"></output></div>
        <input type="range" id="sim" min="1500" max="7000" step="50" value="3200">
        <small data-t="sim_note"></small>
      </div>
      <div class="goals">
        <div class="tower" id="tower" aria-hidden="true"></div>
        <div class="glist" id="glist"></div>
      </div>
      <p class="morewrap" data-t="more_goals"></p>
    </div>
  </section>

  <!-- ===== ROADMAP ===== -->
  <section id="roadmap" data-world="orbit" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="road_h"></h2></div>
      <div class="roadwrap">
        <svg class="roadline" id="roadline" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true"><line x1="5" y1="0" x2="5" y2="100" /></svg>
        <img class="climber" id="roadClimber" alt="" src="assets/pezzi/lego_T.webp" width="64" height="43" aria-hidden="true">
        <ul class="road" id="road"></ul>
      </div>
    </div>
  </section>

  <!-- ===== TEAM ===== -->
  <section id="team" data-world="dawn" data-tp>
    <div class="wrap">
      <div class="sec-head"><h2 class="pl" data-t="team_h"></h2></div>
      <div class="team">
        <div class="card" data-rv="left">
          <p data-t="team_p1"></p><p data-t="team_p2"></p><p data-t="team_p3"></p>
        </div>
        <div data-rv="right">
          <div class="duo">
            <div class="who"><div class="av" style="background:#ff8c17">T</div><div><b>Tiziano</b><span data-t="who1"></span></div></div>
            <div class="who"><div class="av" style="background:#2969f5">G</div><div><b>Gianluca</b><span data-t="who2"></span></div></div>
          </div>
          <div class="risk"><h3 data-t="help_h"></h3><p data-t="help_p"></p></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== NEWSLETTER + COUNTDOWN + CHIUSURA ===== -->
  <section class="closing" id="join" data-world="dawn" data-tp>
    <div class="pila" id="pilaClose" aria-hidden="true"></div>
    <div class="wrap inner">
      <h2 class="pl" data-t="close_h"></h2>
      <p class="lede" data-t="close_p"></p>
      <div class="countdown" id="countdown" role="timer" aria-live="off">
        <p class="cd-label" id="cdLabel"></p>
